name: Signaler un bug
description: Signaler un comportement incorrect dans Patrimoine360 Core
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de vérifier que le problème concerne le dépôt public Patrimoine360 Core et qu'aucune donnée sensible n'est incluse.
  - type: textarea
    id: problem
    attributes:
      label: Problème rencontré
      description: Décrivez le comportement observé et son impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      value: |
        1. Aller à ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Décrivez ce qui devrait se produire.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Type de déploiement
      options:
        - Développement local
        - Auto-hébergé
        - Image communautaire GHCR
        - Autre
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
      placeholder: "Exemple : main@abc1234"
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Navigateur concerné
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Non applicable
  - type: textarea
    id: logs
    attributes:
      label: Journaux utiles
      description: Supprimez les secrets, jetons et données personnelles avant de publier.
      render: shell
  - type: checkboxes
    id: scope
    attributes:
      label: Vérification du périmètre
      options:
        - label: Le problème concerne une fonctionnalité Core et non un module Enterprise privé.
          required: true
