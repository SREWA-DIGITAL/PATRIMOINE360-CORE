name: Proposer une fonctionnalité Core
description: Proposer une amélioration générique pour Patrimoine360 Core
title: "[Fonctionnalité] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Une fonctionnalité Core doit être générique, communautaire et exploitable sans module propriétaire.
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Quel besoin commun à plusieurs organisations avez-vous identifié ?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Décrivez le résultat attendu sans imposer inutilement une implémentation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives étudiées
      description: Quelles solutions existantes ou plus simples avez-vous envisagées ?
  - type: textarea
    id: community
    attributes:
      label: Utilité communautaire
      description: Expliquez pourquoi cette fonction doit appartenir au Core public.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Vérification du périmètre
      options:
        - label: La proposition ne dépend pas d'une donnée, d'un workflow ou d'une intégration propre à un client.
          required: true
        - label: La proposition ne relève pas des modules Patrimoine360 Enterprise.
          required: true
